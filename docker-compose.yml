version: "3.8"

services:
    app:
        build:
            context: .
        container_name: tiba_asili_site
        ports:
            - "8001:8000"
        volumes:
            - .:/var/www/tibaasili/tibaasiliweb
            - laravel_storage:/var/www/tibaasili/tibaasiliweb/storage
            - laravel_cache:/var/www/tibaasili/tibaasiliweb/bootstrap/cache
        networks:
            - tiba_asili_network
        environment:
            - DB_CONNECTION=sqlite

    nginx:
        image: nginx:alpine
        container_name: tiba_asili_nginx
        ports:
            - "9000:80"
        volumes:
            - ./nginx/app.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www/tibaasili/tibaasiliweb
        networks:
            - tiba_asili_network
        depends_on:
            - app

volumes:
    laravel_storage:
    laravel_cache:

networks:
    tiba_asili_network:
        driver: bridge
