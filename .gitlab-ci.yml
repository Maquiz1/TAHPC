stages:
  - pull_changes

variables:
  GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"

pull_changes_production_server:
  stage: pull_changes
  tags:
    - production
  only:
    - production

  before_script:
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_CI" | base64 -d > ~/.ssh/id_rsa_gitlab_ci
    - chmod 600 ~/.ssh/id_rsa_gitlab_ci
    - ssh-add ~/.ssh/id_rsa_gitlab_ci
    - ssh-keyscan -H "75.119.153.212" >> ~/.ssh/known_hosts
#    - ssh mulisa@75.119.153.212 "cd /var/www/tibaasili/tibaasiliweb && git pull origin main"

  script:
    - |
      git_pull() {
        dir=$1
        echo "Marking $dir as safe directory for Git"
        git config --global --add safe.directory $dir

        echo "Fixing .git directory ownership"
        sudo chown -R $USER:$USER $dir/.git

        echo "Pulling changes for $dir"
        cd $dir

        # Avoid unnecessary commit attempt if nothing changed
        if ! git diff --quiet; then
          git add .
          git commit -m "Runner Committing local changes before pull"
        else
          echo "No changes to commit"
        fi

        git pull git@gitlab.com:development3123049/tibaasiliweb.git
      }

      git_pull /var/www/tibaasili/tibaasiliweb/
